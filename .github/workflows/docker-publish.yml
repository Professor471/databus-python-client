name: Build and push Docker image to DockerHub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # allows manual trigger

concurrency:
  group: docker-publish
  cancel-in-progress: false

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Extract package version
        id: package
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib

          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["tool"]["poetry"]["version"]

          print(f"version={version}")
          PY

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DBP_DOCKERHUB_CREDENTIAL_USERNAME }}
          password: ${{ secrets.DBP_DOCKERHUB_CREDENTIAL_TOKEN_PUSHIMAGES }}

      - name: Check whether version is already published
        id: registry
        env:
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          image="dbpedia/databus-python-client:${VERSION}"
          error_file=$(mktemp)
          trap 'rm -f "$error_file"' EXIT

          if docker manifest inspect "$image" > /dev/null 2> "$error_file"; then
            echo "Version ${VERSION} already exists; skipping publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif grep -q '^no such manifest:' "$error_file"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            echo "Could not check whether ${image} exists; refusing to publish." >&2
            exit 1
          fi

      - name: Build and push Docker image
        if: steps.registry.outputs.publish == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            dbpedia/databus-python-client:latest
            dbpedia/databus-python-client:${{ steps.package.outputs.version }}
